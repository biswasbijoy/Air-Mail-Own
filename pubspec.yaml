name: airmail
description: AirMail - a Flutter messaging app with real-time chat.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  socket_io_client: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/Lato/Lato-Regular.ttf
        - asset: assets/Lato/Lato-Bold.ttf
          weight: 700
        - asset: assets/Lato/Lato-Italic.ttf
          style: italic
        - asset: assets/Lato/Lato-BoldItalic.ttf
          weight: 700
          style: italic
